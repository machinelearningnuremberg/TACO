[project]
name = "tabpfn-taco"
dynamic = ["version"]
description = "TACO: End-to-End Compression for Tabular Foundation Models"
readme = "README.md"
authors = [
    { name = "Guri Zabërgja" },
    { name = "Rafiq Kamel" } ,
    { name = "Arlind Kadra" } ,
    { name = "Christian M. M. Frey"},
    { name = "Josif Grabocka" } ,
]
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9,<3.13"
keywords = ["tabular data", "foundation model", "TACO", "in-context learning", "context compression"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3',
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.2,<3",  # to enjoy Flash Attention v2
    "scikit-learn>=1.3.0,<1.7",
    "numpy",
    "scipy",
    "joblib",
    "einops>=0.7",
    "psutil",
    "tqdm>=4.64.0",
    "huggingface-hub",
    "pandas",
    "pydantic_settings",
]

[project.optional-dependencies]
train = [
    "transformers",
    "wandb",
    "xgboost",
]

[project.urls]
Homepage = "https://github.com/machinelearningnuremberg/TACO"
Repository = "https://github.com/machinelearningnuremberg/TACO"
Issues = "https://github.com/machinelearningnuremberg/TACO/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/taco/__about__.py"


[tool.hatch.build.targets.sdist]
only-include = [
    "src/taco",
    "tests",
    "examples",
    "scripts",
    "LICENSE",
    "LICENSES",
    "THIRD_PARTY_NOTICES.md",
    "CITATION.cff",
    "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taco"]

[tool.hatch.build.targets.wheel.force-include]
"CITATION.cff" = "taco/CITATION.cff"
"src/taco/model/tabpfn_arch/model/taco_tabpfn_config.json" = "taco/model/tabpfn_arch/model/taco_tabpfn_config.json"

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.envs.default]
installer = "uv"
features = []

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
installer = "uv"
features = []

[tool.pytest.ini_options]
pythonpath = "src"  # to allow importing taco instead of src.taco

[tool.hatch.envs.types]
extra-dependencies = [
    "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:taco tests}"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "src/taco/__about__.py",
]

[tool.coverage.paths]
taco = ["src"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
